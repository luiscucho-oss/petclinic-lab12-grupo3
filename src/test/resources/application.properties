# Cada contexto de Spring usa su propia base; los scripts conservan los datos de referencia.
spring.profiles.active=h2
spring.datasource.url=jdbc:h2:mem:petclinic-${random.uuid};MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.jpa.open-in-view=false
logging.file.name=target/test-logs/application.log
